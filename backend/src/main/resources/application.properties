# Configuración de la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://proyectoandaluciaskills-db:3306/andaluciaskills
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración JWT
jwt.secret=miClaveSecretaMuyLargaYSeguraQueEsDeAlMenos32Caracteres
jwt.expiration=3600000  
# Establece un tiempo de expiración en milisegundos (1 hora en este caso)


spring.mvc.static-path-pattern=/uploads/**
spring.resources.static-locations=file:uploads/ 

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html