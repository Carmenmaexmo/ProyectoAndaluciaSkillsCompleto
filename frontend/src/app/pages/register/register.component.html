<div class="container mt-5">
  <h2>Registro de Experto/a</h2>

  <form (ngSubmit)="onRegister()">
    <div class="mb-3">
      <label class="form-label">Nombre de Usuario</label>
      <input type="text" class="form-control" [(ngModel)]="user.username" name="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" [(ngModel)]="user.password" name="password" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" [(ngModel)]="user.nombre" name="nombre" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Apellidos</label>
      <input type="text" class="form-control" [(ngModel)]="user.apellidos" name="apellidos" required>
    </div>
    <div class="mb-3">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" [(ngModel)]="user.dni" name="dni" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Especialidad</label>
      <select class="form-control" [(ngModel)]="user.especialidadId" name="especialidadId" required>
        <option *ngFor="let especialidad of especialidades" [value]="especialidad.idEspecialidad">
          {{ especialidad.nombre }}
        </option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Registrar</button>
  </form>

  <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
</div>
